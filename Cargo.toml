[workspace]
members = ["crates/seter-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jardarton/seter"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
fs2 = "0.4"
libc = "0.2"
similar = "2.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
